[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "open-grocery-mcp"
version = "0.5.0"
description = "Location-aware MCP server for supermarket comparison, safe shopping and HTTP-contract diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Pardo" }]
keywords = ["mcp", "grocery", "supermarket", "price-comparison", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.29,<2",
  "mcp-usc @ git+https://github.com/PabloPC05/mcp-usc.git@b657c18a0fa449a0d9a381dffde0ca5b2e2517d5",
]

[project.optional-dependencies]
browser = [
  "playwright>=1.50,<2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
open-grocery-mcp = "open_grocery_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/PabloPC05/open-grocery-mcp"
Issues = "https://github.com/PabloPC05/open-grocery-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/open_grocery_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "open_grocery_mcp/data"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
