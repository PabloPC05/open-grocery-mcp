name: Apply Gadis and Froiz browser adapters

on:
  push:
    branches:
      - feat/initial-mcp

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-mcp
          fetch-depth: 0

      - name: Decode and apply reviewed update
        shell: bash
        run: |
          set -euo pipefail
          test -f .open-grocery-update.b64
          base64 --decode .open-grocery-update.b64 > /tmp/open-grocery-update.tgz
          tar -xzf /tmp/open-grocery-update.tgz -C .
          rm -f \
            .open-grocery-update.b64 \
            .github/workflows/apply-gadis-froiz-update.yml \
            tools/apply-browser-adapters.sh \
            tools/README-update.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify full project
        run: |
          pytest
          python -m compileall -q src tests
          ruff check .

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .env.example \
            .gitignore \
            CONTRIBUTING.md \
            Makefile \
            README.md \
            SECURITY.md \
            pyproject.toml \
            docs/authenticated-workflows.md \
            docs/browser-adapters.md \
            docs/provider-contract.md \
            src/open_grocery_mcp/__init__.py \
            src/open_grocery_mcp/registry.py \
            src/open_grocery_mcp/workflow_base.py \
            src/open_grocery_mcp/providers/__init__.py \
            src/open_grocery_mcp/providers/browser_commerce.py \
            src/open_grocery_mcp/providers/playwright_commerce.py \
            src/open_grocery_mcp/providers/browser_full.py \
            src/open_grocery_mcp/providers/gadis_full.py \
            src/open_grocery_mcp/providers/froiz_full.py \
            tests/test_browser_commerce.py \
            tests/test_browser_workflows.py \
            tests/test_registry.py \
            tests/test_workflows.py \
            .open-grocery-update.b64 \
            .github/workflows/apply-gadis-froiz-update.yml \
            tools/apply-browser-adapters.sh \
            tools/README-update.md
          git diff --cached --check
          git commit -m 'feat: add authenticated Gadis and Froiz browser workflows'
          git push origin HEAD:feat/initial-mcp
