name: Apply secure bootstrap poll fix

on:
  push:
    branches: [feat/initial-mcp]
    paths: [.github/workflows/fix-secure-poll.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-mcp
          fetch-depth: 0
      - name: Patch refspec and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/secure-account-bootstrap.yml')
          text = path.read_text()
          old = 'git fetch origin "$GITHUB_REF_NAME" --quiet'
          new = 'git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/$GITHUB_REF_NAME" --quiet'
          if old not in text:
              raise SystemExit('expected fetch command was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-secure-poll.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin feat/initial-mcp
          git add -- .github/workflows/secure-account-bootstrap.yml .github/workflows/fix-secure-poll.yml
          git commit -m 'fix: update secure bootstrap polling ref [skip ci]'
          git push origin HEAD:feat/initial-mcp
