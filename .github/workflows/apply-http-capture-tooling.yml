name: Apply HTTP capture tooling

on:
  push:
    branches: [feat/initial-mcp]
    paths:
      - .http-capture-update/**
      - .github/workflows/apply-http-capture-tooling.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/initial-mcp
          fetch-depth: 0

      - name: Decode reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          cat .http-capture-update/part-* > /tmp/http-capture.b64
          base64 --decode /tmp/http-capture.b64 > /tmp/http-capture.tgz
          tar -xzf /tmp/http-capture.tgz -C .
          rm -rf .http-capture-update
          rm -f .github/workflows/apply-http-capture-tooling.yml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Verify project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,browser]'
          pytest
          python -m compileall -q src tests tools
          ruff check .

      - name: Commit verified tooling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .gitignore \
            .github/workflows/capture-http-contract.yml \
            docs/http-contract-capture.md \
            tools/capture-request.json \
            tools/capture_http_contract.py
          git add -u -- .http-capture-update .github/workflows/apply-http-capture-tooling.yml
          git diff --cached --check
          git commit -m 'feat: add sanitized HTTP contract capture tooling'
          git push origin HEAD:feat/initial-mcp
