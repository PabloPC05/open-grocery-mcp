name: Capture retailer HTTP contract

on:
  push:
    branches: [feat/initial-mcp]
    paths:
      - tools/capture_http_contract.py
      - tools/http_capture/**
      - tools/capture-request.json
      - .github/workflows/capture-http-contract.yml
  workflow_dispatch:
    inputs:
      store:
        description: Retailer to inspect
        required: true
        type: choice
        default: all
        options: [all, gadis, froiz]
      mode:
        description: Guest or disposable authenticated test account
        required: true
        type: choice
        default: guest
        options: [guest, authenticated]

concurrency:
  group: http-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GADIS_TEST_USERNAME: ${{ secrets.GADIS_TEST_USERNAME }}
      GADIS_TEST_PASSWORD: ${{ secrets.GADIS_TEST_PASSWORD }}
      FROIZ_TEST_USERNAME: ${{ secrets.FROIZ_TEST_USERNAME }}
      FROIZ_TEST_PASSWORD: ${{ secrets.FROIZ_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Resolve capture request
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STORE: ${{ inputs.store }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${INPUT_STORE:-all}"
            mode="${INPUT_MODE:-guest}"
          else
            target="$(python -c 'import json; print(json.load(open("tools/capture-request.json"))["store"])')"
            mode="$(python -c 'import json; print(json.load(open("tools/capture-request.json"))["mode"])')"
          fi
          [[ "$target" =~ ^(all|gadis|froiz)$ ]]
          [[ "$mode" =~ ^(guest|authenticated)$ ]]
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Validate disposable account secrets
        if: steps.plan.outputs.mode == 'authenticated'
        shell: bash
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "all" || "$TARGET" == "gadis" ]]; then
            [[ -n "${GADIS_TEST_USERNAME:-}" && -n "${GADIS_TEST_PASSWORD:-}" ]]
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "froiz" ]]; then
            [[ -n "${FROIZ_TEST_USERNAME:-}" && -n "${FROIZ_TEST_PASSWORD:-}" ]]
          fi

      - name: Install project and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,browser]'
          python -m playwright install --with-deps chromium

      - name: Capture value-free contracts
        id: capture
        continue-on-error: true
        shell: bash
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          MODE: ${{ steps.plan.outputs.mode }}
          OPEN_GROCERY_CAPTURE_HEADLESS: "0"
        run: |
          set +e
          mkdir -p captures
          failed=0
          for store in gadis froiz; do
            if [[ "$TARGET" != "all" && "$TARGET" != "$store" ]]; then
              continue
            fi
            xvfb-run -a python tools/capture_http_contract.py \
              --store "$store" \
              --mode "$MODE" \
              --output "captures/${store}-${MODE}.json"
            code=$?
            printf '%s\n' "$code" > "captures/${store}-${MODE}.exit-code"
            if [[ "$code" -ne 0 ]]; then failed=1; fi
          done
          exit "$failed"

      - name: Print non-sensitive summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('captures').glob('*.json')):
              data = json.loads(path.read_text())
              print(
                  f"{data.get('store')}: events={len(data.get('events', []))} "
                  f"endpoints={len(data.get('endpoint_manifest', []))} "
                  f"blocked={len(data.get('blocked', []))} errors={len(data.get('errors', []))}"
              )
          PY

      - name: Publish guest endpoint manifests
        if: always() && steps.plan.outputs.mode == 'guest'
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics/http-contracts
          python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          produced = []
          for source in Path('captures').glob('*-guest.json'):
              data = json.loads(source.read_text())
              public = {
                  'schema_version': data.get('schema_version'),
                  'captured_at': data.get('captured_at'),
                  'store': data.get('store'),
                  'mode': 'guest',
                  'endpoint_manifest': data.get('endpoint_manifest', []),
                  'blocked': data.get('blocked', []),
                  'errors': data.get('errors', []),
                  'safety': data.get('safety', {}),
              }
              target = Path('diagnostics/http-contracts') / f"{data['store']}-guest.json"
              target.write_text(json.dumps(public, indent=2, ensure_ascii=False) + '\n')
              produced.append(data['store'])

          status = {
              'recorded_at': datetime.now(UTC).isoformat(),
              'requested_target': os.environ.get('TARGET'),
              'capture_outcome': os.environ.get('CAPTURE_OUTCOME'),
              'manifests_produced': sorted(produced),
          }
          Path('diagnostics/http-contracts/last-guest-run.json').write_text(
              json.dumps(status, indent=2) + '\n'
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- diagnostics/http-contracts
          if git diff --cached --quiet; then
            echo 'No guest manifest changes.'
          else
            git commit -m 'chore: publish sanitized guest HTTP manifests [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload sanitized diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: http-contract-${{ steps.plan.outputs.target }}-${{ steps.plan.outputs.mode }}-${{ github.run_id }}
          path: captures/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after preserving diagnostics
        if: steps.capture.outcome == 'failure'
        run: exit 1
