name: Capture retailer HTTP contract

on:
  push:
    branches: [feat/initial-mcp]
    paths:
      - tools/capture_http_contract.py
      - tools/http_capture_sanitize.py
      - tools/capture-request.json
      - .github/workflows/capture-http-contract.yml
  workflow_dispatch:
    inputs:
      store:
        description: Retailer to inspect
        required: true
        type: choice
        default: all
        options: [all, gadis, froiz]
      mode:
        description: Guest or disposable authenticated test account
        required: true
        type: choice
        default: guest
        options: [guest, authenticated]

permissions:
  contents: read

jobs:
  capture:
    name: Capture ${{ matrix.store }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        store: [gadis, froiz]

    env:
      GADIS_TEST_USERNAME: ${{ secrets.GADIS_TEST_USERNAME }}
      GADIS_TEST_PASSWORD: ${{ secrets.GADIS_TEST_PASSWORD }}
      FROIZ_TEST_USERNAME: ${{ secrets.FROIZ_TEST_USERNAME }}
      FROIZ_TEST_PASSWORD: ${{ secrets.FROIZ_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Decide whether this matrix entry should run
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_STORE: ${{ inputs.store }}
          INPUT_MODE: ${{ inputs.mode }}
          MATRIX_STORE: ${{ matrix.store }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            target="${INPUT_STORE:-all}"
            mode="${INPUT_MODE:-guest}"
          else
            target="$(python -c 'import json; print(json.load(open("tools/capture-request.json"))["store"])')"
            mode="$(python -c 'import json; print(json.load(open("tools/capture-request.json"))["mode"])')"
          fi
          if [[ "$target" == "all" || "$target" == "$MATRIX_STORE" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Install project and browser
        if: steps.plan.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,browser]'
          python -m playwright install --with-deps chromium

      - name: Validate disposable test-account secrets
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.mode == 'authenticated'
        shell: bash
        env:
          STORE: ${{ matrix.store }}
        run: |
          set -euo pipefail
          if [[ "$STORE" == "gadis" ]]; then
            [[ -n "${GADIS_TEST_USERNAME:-}" && -n "${GADIS_TEST_PASSWORD:-}" ]]
          else
            [[ -n "${FROIZ_TEST_USERNAME:-}" && -n "${FROIZ_TEST_PASSWORD:-}" ]]
          fi

      - name: Capture and sanitize traffic
        id: capture
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        shell: bash
        env:
          STORE: ${{ matrix.store }}
          MODE: ${{ steps.plan.outputs.mode }}
          OPEN_GROCERY_CAPTURE_HEADLESS: "0"
        run: |
          set +e
          mkdir -p captures
          xvfb-run -a python tools/capture_http_contract.py \
            --store "$STORE" \
            --mode "$MODE" \
            --output "captures/${STORE}-${MODE}.json"
          status=$?
          printf '%s\n' "$status" > "captures/${STORE}-${MODE}.exit-code"
          exit "$status"

      - name: Write non-sensitive summary
        if: always() && steps.plan.outputs.run == 'true'
        shell: bash
        env:
          STORE: ${{ matrix.store }}
          MODE: ${{ steps.plan.outputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          path = Path("captures") / f"{os.environ['STORE']}-{os.environ['MODE']}.json"
          if not path.exists():
              print("No capture JSON was produced.")
              raise SystemExit(0)
          data = json.loads(path.read_text())
          methods = Counter(entry["request"]["method"] for entry in data.get("entries", []))
          print(f"store={data.get('store')} mode={data.get('mode')}")
          print(f"entries={len(data.get('entries', []))} blocked={len(data.get('blocked', []))} errors={len(data.get('errors', []))}")
          print("methods=" + ", ".join(f"{k}:{v}" for k, v in sorted(methods.items())))
          PY

      - name: Upload sanitized contract artifact
        if: always() && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: http-contract-${{ matrix.store }}-${{ steps.plan.outputs.mode }}-${{ github.run_id }}
          path: captures/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail after preserving diagnostics
        if: steps.plan.outputs.run == 'true' && steps.capture.outcome == 'failure'
        run: exit 1
